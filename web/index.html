<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Status</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" class="logo-bg" />
          <polyline points="6 17 11 17 13.5 10 17 23 19.5 17 26 17" fill="none"
                    class="logo-pulse" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1 id="page-title">Status</h1>
      </div>
      <div class="refresh">
        <span class="refresh-dot" id="refresh-dot" aria-hidden="true"></span>
        <span id="refresh-label">connecting…</span>
      </div>
    </header>

    <main id="root" aria-live="polite">
      <noscript>
        <section class="hero hero--pending">
          <div class="hero-text">
            <p class="hero-title">JavaScript is required</p>
            <p class="hero-sub">This status page renders in your browser. The raw data is
              also available at <code>/api/v1/summary</code>.</p>
          </div>
        </section>
      </noscript>
      <!-- Populated by app.js; shows skeletons until the first successful fetch. -->
      <section class="hero hero--pending hero--skeleton" aria-hidden="true">
        <div class="hero-icon skeleton"></div>
        <div class="hero-text">
          <div class="skeleton-line skeleton" style="width: 42%"></div>
          <div class="skeleton-line skeleton" style="width: 26%"></div>
        </div>
      </section>
      <div class="grid">
        <div class="card card--skeleton"></div>
        <div class="card card--skeleton"></div>
        <div class="card card--skeleton"></div>
      </div>
    </main>

    <footer class="site-footer">
      Powered by simple-status
    </footer>
  </div>
</body>
</html>
